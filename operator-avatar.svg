<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#E11D2E" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7A0F1A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0A0506" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A0E12"/>
      <stop offset="100%" stop-color="#0D0506"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E11D2E"/>
      <stop offset="100%" stop-color="#FF6A1A"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#E11D2E" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="400" height="400" fill="#0A0506"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- shoulders -->
  <path d="M40 400 C50 320 120 285 200 285 C280 285 350 320 360 400 Z" fill="url(#hood)" stroke="url(#edge)" stroke-width="2"/>
  <!-- hood -->
  <path d="M200 60 C128 60 98 118 98 178 C98 220 112 252 135 280 L265 280 C288 252 302 220 302 178 C302 118 272 60 200 60 Z"
        fill="url(#hood)" stroke="url(#edge)" stroke-width="3"/>
  <!-- face void -->
  <path d="M200 100 C158 100 138 138 138 178 C138 214 158 244 200 252 C242 244 262 214 262 178 C262 138 242 100 200 100 Z" fill="#050203"/>

  <!-- eyes -->
  <g filter="url(#blur)" opacity="0.9">
    <rect x="164" y="170" width="26" height="7" rx="3" fill="#E11D2E"/>
    <rect x="210" y="170" width="26" height="7" rx="3" fill="#E11D2E"/>
  </g>
  <rect x="164" y="170" width="26" height="6" rx="3" fill="#FF4A57"/>
  <rect x="210" y="170" width="26" height="6" rx="3" fill="#FF4A57"/>

  <!-- terminal prompt on face -->
  <text x="200" y="222" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#FF6A1A">&gt;_</text>

  <!-- chest code lines -->
  <g font-family="monospace" font-size="9" fill="#E11D2E" fill-opacity="0.75">
    <text x="150" y="325">root@redteam:~$ whoami</text>
    <text x="150" y="340">mariya-shaikh</text>
    <text x="150" y="355">status: authorized only</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#FF6A1A" stroke-width="3" fill="none">
    <path d="M14 44V14H44"/>
    <path d="M356 14H386V44"/>
    <path d="M14 356V386H44"/>
    <path d="M386 356V386H356"/>
  </g>
  <text x="200" y="30" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="3" fill="#E11D2E">RED_TEAM_ANALYST</text>

  <rect width="400" height="400" fill="url(#scan)"/>
</svg>
