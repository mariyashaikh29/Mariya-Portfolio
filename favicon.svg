<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A0D10" />
      <stop offset="60%" stop-color="#0A0506" />
      <stop offset="100%" stop-color="#060304" />
    </radialGradient>

    <!-- Crimson to Ember Gradient -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A1A" />
      <stop offset="45%" stop-color="#E11D2E" />
      <stop offset="100%" stop-color="#B81423" />
    </linearGradient>

    <!-- Amber Accent Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020" />
      <stop offset="100%" stop-color="#FF6A1A" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Tactical Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#3A1318" stroke-width="1.5" />

  <!-- Outer Cyber Corner Accents -->
  <path d="M 10 16 L 10 10 L 16 10" fill="none" stroke="#FF6A1A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M 54 16 L 54 10 L 48 10" fill="none" stroke="#FF6A1A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M 10 48 L 10 54 L 16 54" fill="none" stroke="#FF6A1A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M 54 48 L 54 54 L 48 54" fill="none" stroke="#FF6A1A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Tactical Offensive Shield Contour -->
  <path d="M 32 8 
           L 49 15 
           L 49 33 
           C 49 44, 32 54, 32 56 
           C 32 54, 15 44, 15 33 
           L 15 15 Z" 
        fill="#140A0C" 
        stroke="url(#redGlow)" 
        stroke-width="2.2" 
        stroke-linejoin="round"
        filter="url(#neonBlur)" />

  <!-- Inner Reticle Crosshair Line (Horizontal Faint) -->
  <line x1="18" y1="30" x2="46" y2="30" stroke="#E11D2E" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.45" />

  <!-- Stylized Military 'M' Monogram with Angular Terminal Serifs -->
  <path d="M 22 41 
           L 22 23 
           L 32 34 
           L 42 23 
           L 42 41" 
        fill="none" 
        stroke="#F2E9E9" 
        stroke-width="3.5" 
        stroke-linecap="square" 
        stroke-linejoin="miter" />

  <!-- Angular Inner Apex Red Accent on 'M' -->
  <path d="M 27 28.5 L 32 34 L 37 28.5" 
        fill="none" 
        stroke="url(#redGlow)" 
        stroke-width="2.2" 
        stroke-linecap="round" />

  <!-- Top Beacon / Red Team Indicator Dot -->
  <circle cx="32" cy="14" r="2.2" fill="#FF6A1A" filter="url(#neonBlur)" />
  <circle cx="32" cy="14" r="1.2" fill="#FFE5D9" />
</svg>
